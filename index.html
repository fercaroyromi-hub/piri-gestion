<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pirí Gestión</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#FBF6EE">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400&display=swap">
<style>
/* Plan: una columna de celular (máx. 480 px). Paleta sacada del logo de Pirí: turquesa, coral y dorado
   sobre crema, con tinta casi negra. Tarjeta principal turquesa con manchas de acuarela como en el logo.
   Barra inferior flotante con "+" coral. Tres apariencias elegibles: Pirí, Noche y Clásico. */
:root{
  color-scheme:light;
  --fondo:#FBF6EE; --tarjeta:#FFFFFF; --borde:#EADFCF; --borde2:#CDBDA6;
  --tinta:#16130F; --suave:#675E55; --pri:#16130F; --sobre-pri:#FFFFFF;
  --verde:#0E7C78; --verde-tinta:#0B5E5B; --verde-fondo:#D9F1EE; --verde-solido:#0E7C78; --vivo:#2BB8B0;
  --acento:#E8674E; --rojo-solido:#B93D26; --rojo-tinta:#9C3220; --rojo-fondo:#FBE3DB;
  --oro:#F3C56B; --oro-tinta:#7D5A12; --oro-fondo:#F8EBCB;
  --hero-a:#0C7A76; --hero-b:#0A4F5E; --foto:#F3EADB; --barra0:#E3D7C5;
  --sombra:0 8px 24px rgba(70,45,10,.10);
  --serif:'Fraunces',Georgia,serif; --sans:'DM Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
}
:root[data-piel="noche"]{
  color-scheme:dark;
  --fondo:#0F0E0D; --tarjeta:#1B1917; --borde:#2E2A26; --borde2:#4A423A;
  --tinta:#F6F0E6; --suave:#B8AEA1; --pri:#F6F0E6; --sobre-pri:#16130F;
  --verde:#5FD6CD; --verde-tinta:#8BE3DC; --verde-fondo:#12383A; --verde-solido:#0E7C78; --vivo:#2BB8B0;
  --acento:#E8674E; --rojo-solido:#B93D26; --rojo-tinta:#FFA896; --rojo-fondo:#452019;
  --oro:#F3C56B; --oro-tinta:#F3C56B; --oro-fondo:#3B2E12;
  --hero-a:#0C7A76; --hero-b:#083A47; --foto:#26221E; --barra0:#3A342E;
  --sombra:0 8px 24px rgba(0,0,0,.45);
}
:root[data-piel="clasico"]{
  color-scheme:light;
  --fondo:#F4F6FA; --tarjeta:#FFFFFF; --borde:#DDE3EC; --borde2:#B7C2D1;
  --tinta:#17263B; --suave:#5B6472; --pri:#17263B; --sobre-pri:#FFFFFF;
  --verde:#2D5C52; --verde-tinta:#1F4A41; --verde-fondo:#E1EDE9; --verde-solido:#2D5C52; --vivo:#3F8576;
  --acento:#A07C3F; --rojo-solido:#8C3B2A; --rojo-tinta:#7A2E1F; --rojo-fondo:#F6E4DE;
  --oro:#E3C992; --oro-tinta:#7A5C26; --oro-fondo:#F3EAD8;
  --hero-a:#17263B; --hero-b:#24406A; --foto:#E9EDF3; --barra0:#D5DCE6;
  --sombra:0 8px 24px rgba(20,35,60,.10);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--fondo);color:var(--tinta);font-family:var(--sans);font-size:15px;line-height:1.4;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--verde);outline-offset:2px}
h1,h2,h3,p{margin:0}
.app{max-width:480px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;background:var(--fondo)}
.cab{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:12px;padding:12px 16px;background:var(--fondo);border-bottom:1px solid var(--borde)}
.cab img{width:42px;height:42px;border-radius:12px;object-fit:cover;box-shadow:var(--sombra)}
.cab .tit{flex:1;font-family:var(--serif);font-size:22px;font-weight:600;letter-spacing:-.01em}
.cab .tit em{font-style:italic;font-weight:400;color:var(--verde)}
:root[data-modo="real"] :is([data-a="estado"],[data-a="cobrar"],[data-a="anular"],[data-a="aj"],[data-a="guardar-prod"],[data-a="nuevo-prod"],[data-a="color-add"],[data-a="nueva-compra"],[data-a="reiniciar"],.solo-prueba){display:none !important}
.pill-prueba.real{color:var(--verde-tinta);background:var(--verde-fondo)}
.nota{font-size:13px;color:var(--suave);background:var(--oro-fondo);border-radius:14px;padding:10px 12px}
.pill-prueba{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--rojo-tinta);background:var(--rojo-fondo);border-radius:999px;padding:5px 10px;white-space:nowrap}
.atras{width:44px;height:44px;margin-left:-8px;display:flex;align-items:center;justify-content:center;background:none;border:0;color:var(--tinta)}
main{flex:1;display:flex;flex-direction:column;gap:16px;padding:18px 16px 24px}
.ceja{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--verde)}
h1{font-family:var(--serif);font-weight:600;font-size:30px;line-height:1.15;letter-spacing:-.02em;text-wrap:balance}
h2{font-family:var(--serif);font-weight:600;font-size:20px;letter-spacing:-.01em}
.fila-tit{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.enlace{background:none;border:0;padding:8px 0;font-size:13px;font-weight:700;color:var(--verde)}
.tarjeta{background:var(--tarjeta);border:1px solid var(--borde);border-radius:18px;box-shadow:var(--sombra)}
.lista{display:flex;flex-direction:column;gap:10px}
.hero{position:relative;overflow:hidden;border-radius:24px;padding:18px 18px 14px;color:#fff;display:flex;flex-direction:column;gap:4px;box-shadow:var(--sombra);
  background:radial-gradient(circle at 92% 8%,rgba(232,103,78,.75) 0,rgba(232,103,78,0) 34%),radial-gradient(circle at 78% 104%,rgba(243,197,107,.45) 0,rgba(243,197,107,0) 36%),linear-gradient(135deg,var(--hero-a),var(--hero-b))}
.hero .h-et{font-size:13px;font-weight:600;opacity:.92}
.hero>strong{font-family:var(--serif);font-size:42px;font-weight:600;line-height:1.05;letter-spacing:-.02em}
.hero .h-delta{display:inline-flex;align-items:center;gap:4px;align-self:flex-start;font-size:12px;font-weight:700;background:rgba(0,0,0,.28);border-radius:999px;padding:4px 10px;margin-top:4px}
.hero .spark{width:100%;height:56px;margin-top:8px;display:block}
.hero .h-pie{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:8px;padding-top:12px;border-top:1px solid rgba(255,255,255,.28)}
.hero .h-pie div{display:flex;flex-direction:column;min-width:0}
.hero .h-pie b{font-size:17px;font-weight:700}
.hero .h-pie span{font-size:12px;opacity:.92}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.tile{background:var(--tarjeta);border:1px solid var(--borde);box-shadow:var(--sombra);color:var(--tinta);border-radius:20px;padding:12px;text-align:left;display:flex;flex-direction:column;gap:2px;min-width:0}
.tile .ti{width:34px;height:34px;border-radius:12px;display:flex;align-items:center;justify-content:center;margin-bottom:8px}
.tile strong{font-family:var(--serif);font-size:32px;font-weight:600;line-height:1}
.tile b{font-size:13px;font-weight:700}
.tile span:last-child{font-size:12px;color:var(--suave)}
.t-turq .ti{background:var(--verde-fondo);color:var(--verde-tinta)} .t-oro .ti{background:var(--oro-fondo);color:var(--oro-tinta)} .t-coral .ti{background:var(--rojo-fondo);color:var(--rojo-tinta)}
.accion{display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;background:none;border:0;border-bottom:1px solid var(--borde);text-align:left}
.accion:last-child{border-bottom:0}
.icono{width:36px;height:36px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.i-verde{background:var(--verde-fondo);color:var(--verde-tinta)} .i-oro{background:var(--oro-fondo);color:var(--oro-tinta)} .i-rojo{background:var(--rojo-fondo);color:var(--rojo-tinta)}
.accion .txt,.txt2{flex:1;display:flex;flex-direction:column;gap:1px;min-width:0}
.accion b,.txt2 b{font-size:15px;font-weight:700}
.sub{font-size:12px;color:var(--suave)}
.num{font-variant-numeric:tabular-nums}
.grande{font-size:20px;font-weight:700}
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.kpi{background:var(--tarjeta);border:1px solid var(--borde);border-radius:18px;box-shadow:var(--sombra);padding:12px 14px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:2px 10px;align-items:center;min-width:0}
.kpi .icono{grid-row:1}
.kpi .et{font-size:13px;font-weight:600;color:var(--suave)}
.kpi strong{grid-column:1/-1;font-size:23px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:6px}
.kpi .sub{grid-column:1/-1}
.graf{padding:14px 10px;display:flex;flex-direction:column;gap:8px}
.graf .cols{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));align-items:end}
.col{background:none;border:0;padding:2px 0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:3px;height:104px;border-radius:10px}
.col i{display:block;width:16px;border-radius:6px 6px 3px 3px;background:var(--vivo)}
.col.hoy i{background:var(--acento)}
.col i.cero{height:3px;background:var(--barra0);border-radius:2px}
.col small{font-size:11px;color:var(--suave)}
.col em{font-style:normal;font-size:11px;font-weight:700}
.col.sel{background:var(--oro-fondo)} .col.sel small{color:var(--tinta);font-weight:700}
.seg{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}
.chip{flex-shrink:0;min-height:44px;padding:0 14px;border-radius:999px;border:1px solid var(--borde2);background:var(--tarjeta);font-size:13px;font-weight:500;display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{background:var(--pri);border-color:var(--pri);color:var(--sobre-pri);font-weight:700}
.chip.nuevo{border-style:dashed}
.punto{width:12px;height:12px;border-radius:999px;border:1px solid rgba(120,110,100,.7);flex-shrink:0}
.campo{display:flex;flex-direction:column;gap:6px;min-width:0}
.campo label{font-size:12px;font-weight:700}
.campo input,.campo select,.campo textarea,.buscar{width:100%;min-height:46px;padding:8px 14px;background:var(--tarjeta);border:1px solid var(--borde2);border-radius:14px;font-size:15px}
.dos{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.fila-color{display:grid;grid-template-columns:minmax(0,1fr) 84px auto;gap:8px;align-items:end}
.foto{width:54px;height:54px;border-radius:16px;background:var(--foto);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.foto{position:relative;overflow:hidden}
.foto svg{width:42px;height:42px}
.foto img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#fff}
.galeria{display:flex;gap:10px;flex-shrink:0;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -4px;padding:0 4px 4px}
.galeria figure{margin:0;flex:0 0 auto;width:150px;scroll-snap-align:start}
.galeria.una figure{width:100%}
.galeria img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:18px;background:#fff;border:1px solid var(--barra0);display:block}
.galeria.una img{aspect-ratio:4/3;object-fit:contain}
.galeria figcaption{font-size:12px;margin-top:5px;text-align:center;opacity:.75}
.prod{padding:12px;display:flex;flex-direction:column;gap:10px}
.prod.en{border:2px solid var(--verde)}
.prod .arriba{display:flex;align-items:center;gap:12px}
.prod .nom{flex:1;display:flex;flex-direction:column;gap:2px;min-width:0}
.prod .nom b{font-size:15px;font-weight:700}
.pasos{display:flex;align-items:center}
.pm{width:44px;height:44px;border-radius:14px;border:1px solid var(--borde2);background:var(--tarjeta);display:flex;align-items:center;justify-content:center}
.pm.mas{background:var(--verde-solido);border-color:var(--verde-solido);color:#fff}
.pm:disabled{opacity:.4}
.pasos output{width:34px;text-align:center;font-size:17px;font-weight:700;font-variant-numeric:tabular-nums}
.stepper{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stepper div{display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--suave)}
.stepper div::before{content:"";height:5px;border-radius:3px;background:var(--barra0)}
.stepper .on{color:var(--tinta);font-weight:700} .stepper .on::before{background:var(--acento)}
.pie{position:sticky;bottom:0;z-index:4;background:var(--tarjeta);border-top:1px solid var(--borde);border-radius:22px 22px 0 0;box-shadow:0 -8px 24px rgba(0,0,0,.08);padding:14px 16px 16px;display:flex;flex-direction:column;gap:10px}
.pie .tot{display:flex;align-items:baseline;justify-content:space-between}
.pie .tot strong{font-family:var(--serif);font-size:28px;font-weight:600;font-variant-numeric:tabular-nums}
.btn{min-height:50px;padding:0 18px;border-radius:16px;border:1px solid var(--pri);background:var(--pri);color:var(--sobre-pri);font-size:15px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.btn.sec{background:var(--tarjeta);color:var(--tinta);border-color:var(--borde2)}
.btn.peligro{background:var(--tarjeta);color:var(--rojo-tinta);border-color:var(--rojo-tinta)}
.btn.chico{min-height:44px;font-size:13px;padding:0 14px;border-radius:14px}
.btn:disabled{opacity:.45}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btns .btn{flex:1}
.estado{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;border-radius:999px;padding:4px 9px;white-space:nowrap}
.e-ok{color:var(--verde-tinta);background:var(--verde-fondo)} .e-rep{color:#fff;background:var(--rojo-solido)} .e-poco{color:var(--oro-tinta);background:var(--oro-fondo)} .e-neutro{color:var(--suave);border:1px solid var(--borde2)}
.fprod{display:flex;align-items:center;gap:12px;width:100%;padding:12px;text-align:left}
.fprod .der{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.fprod .der .grande{font-family:var(--serif);font-size:26px;font-weight:600;line-height:1}
.resumen{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-radius:22px;padding:16px 8px;color:#fff;box-shadow:var(--sombra);
  background:radial-gradient(circle at 96% 0,rgba(232,103,78,.7) 0,rgba(232,103,78,0) 36%),linear-gradient(135deg,var(--hero-a),var(--hero-b))}
.resumen div{display:flex;flex-direction:column;gap:2px;padding:0 10px;min-width:0}
.resumen div+div{border-left:1px solid rgba(255,255,255,.3)}
.resumen strong{font-family:var(--serif);font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}
.resumen span{font-size:12px;opacity:.92}
.ped{padding:14px;display:flex;flex-direction:column;gap:10px}
.ped .cabp{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.ped .cli{font-size:16px;font-weight:700}
.ped .cabp .grande{font-family:var(--serif);font-size:22px;font-weight:600}
.ped ul{margin:0;padding:0;list-style:none;font-size:13px;display:flex;flex-direction:column;gap:2px}
.rank{padding:4px 14px}
.rank .r{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;padding:11px 0;border-bottom:1px solid var(--borde);font-size:13px}
.rank .r:last-child{border-bottom:0}
.rank .barra{grid-column:1/-1;height:8px;border-radius:4px;background:var(--barra0);overflow:hidden}
.rank .barra i{display:block;height:100%;background:var(--vivo);border-radius:4px}
.rank .r:first-child .barra i{background:var(--acento)}
nav.inf{position:sticky;bottom:10px;z-index:5;margin:0 12px 10px;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));align-items:center;background:var(--tarjeta);border:1px solid var(--borde);border-radius:26px;box-shadow:0 10px 30px rgba(0,0,0,.16);padding:6px 8px}
nav.inf a{min-height:50px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;font-weight:600;color:var(--suave);text-decoration:none;border-radius:16px}
nav.inf a[aria-current="page"]{color:var(--verde-tinta);background:var(--verde-fondo);font-weight:700}
nav.inf a.nueva{justify-self:center;width:58px;height:58px;min-height:58px;margin-top:-26px;border-radius:999px;background:var(--acento);color:#fff;border:4px solid var(--fondo);box-shadow:0 8px 18px rgba(232,103,78,.45)}
#candado{position:fixed;inset:0;z-index:40;background:var(--fondo);display:flex;align-items:center;justify-content:center;padding:24px}
#candado[hidden]{display:none}
#candado .caja{width:100%;max-width:340px;display:flex;flex-direction:column;gap:14px;text-align:center}
#candado img{width:92px;height:92px;border-radius:24px;margin:0 auto}
#candado input{text-align:center;font-size:24px;letter-spacing:.35em}
#candado .olv{background:none;border:0;font-size:13px;text-decoration:underline;opacity:.7;padding:8px}
.velo{position:fixed;inset:0;z-index:20;background:rgba(15,12,8,.6);display:flex;align-items:flex-end;justify-content:center}
.hoja{width:100%;max-width:480px;max-height:92%;overflow-y:auto;background:var(--fondo);border-radius:26px 26px 0 0;padding:18px 16px 24px;display:flex;flex-direction:column;gap:14px}
.hoja .cabh{display:flex;align-items:center;justify-content:space-between;gap:12px}
.x{width:44px;height:44px;border-radius:14px;border:1px solid var(--borde2);background:var(--tarjeta);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.var{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;padding:12px;border-bottom:1px solid var(--borde)}
.var:last-child{border-bottom:0}
.var .n{display:flex;align-items:center;gap:8px;font-weight:700;flex-wrap:wrap}
.tabla{width:100%;border-collapse:collapse;font-size:13px}
.tabla td{padding:9px 0;border-bottom:1px solid var(--borde);vertical-align:top}
.tabla td:last-child{text-align:right;white-space:nowrap}
.tabla tr:last-child td{border-bottom:0}
.toast{position:fixed;left:50%;transform:translateX(-50%);top:74px;z-index:30;width:calc(100% - 32px);max-width:448px;justify-content:space-between;background:var(--pri);color:var(--sobre-pri);border-radius:16px;padding:6px 6px 6px 16px;display:flex;align-items:center;gap:12px;font-size:14px;font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,.3)}
.toast button{min-height:40px;padding:0 12px;border-radius:12px;border:1px solid currentColor;background:none;color:inherit;font-weight:700;font-size:13px}
.vacio{padding:24px 16px;text-align:center;color:var(--suave);font-size:14px}
.check{display:flex;align-items:center;gap:10px;min-height:44px;font-weight:700}
.check input{width:22px;height:22px;min-height:0;accent-color:var(--verde-solido)}
.aviso{font-size:13px;font-weight:700;color:var(--rojo-tinta)}
pre.comp{margin:0;padding:14px;background:var(--tarjeta);border:1px solid var(--borde);border-radius:16px;font-family:var(--sans);font-size:13px;white-space:pre-wrap}
@media (prefers-reduced-motion:no-preference){.hoja{animation:sube .2s ease-out}@keyframes sube{from{transform:translateY(28px);opacity:.6}to{transform:none;opacity:1}}.tile,.btn,.chip,.pm{transition:transform .12s}.tile:active,.btn:active,.chip:active,.pm:active{transform:scale(.97)}}
</style>
</head>
<body>
<div class="app">
  <header class="cab" id="cab"></header>
  <main id="vista"></main>
  <div id="pie"></div>
  <nav class="inf" id="nav" aria-label="Principal"></nav>
</div>
<div id="capa"></div>
<div id="candado" hidden></div>
<div id="tostada" aria-live="polite"></div>
<script>

    case 'candado-ok': guardarCandado(); break;
    case 'candado-quitar': abrirQuitarCandado(); break;
    case 'candado-quitar-si': pinVale($('#cd-q').value.trim()).then(ok => { if (!ok) { const e = $('#cd-msg'); e.textContent = 'El PIN no es correcto.'; e.hidden = false; return; } try { localStorage.removeItem('piri.gestion.candado'); } catch (e) {} cerrar(); pintar(); toast('PIN quitado'); }); break;
    case 'cd-entrar': entrarCandado(); break;
    case 'cd-olvide': olvideCandado(); break;
    case 'cd-volver': trabar(); break;
    case 'cd-borrar': borrarCandado(); break;
    case 'modo': if (d.k === 'real') conectarReal(false); else { U.real = false; lsSet('piri.gestion.modo', 'prueba'); cargar(); deshacer = null; pintar(); toast('Viendo datos de prueba'); } break;
    case 'refrescar': conectarReal(false); break;
    case 'pins-ok': { const v = $('#pin-v').value.trim(), st = $('#pin-s').value.trim(); if (!v || !st) { $('#err-pin').textContent = 'Escribí los dos PIN.'; $('#err-pin').hidden = false; break; } lsSet('piri.gestion.pins', JSON.stringify({ v:v, s:st })); cerrar(); conectarReal(false); break; }
    case 'volver': if (U.ruta === 'nueva' && U.B && U.B.paso > 1) { U.B.paso--; pintar(); window.scrollTo(0, 0); } else { if (U.ruta === 'nueva') U.B = null; ir(U.ruta === 'nueva' ? 'inicio' : 'mas'); } break;
    case 'ir-pend': U.sub = 'pedidos'; U.fped = 'pend'; U.qped = ''; ir('ventas'); break;
    case 'ir-cobrar': U.sub = 'pedidos'; U.fped = 'cobrar'; U.qped = ''; ir('ventas'); break;
    case 'ir-pedidos': U.sub = 'pedidos'; ir('ventas'); break;
    case 'ir-informe': U.sub = 'informe'; ir('ventas'); break;
    case 'ir-reponer': U.fst = 'rep'; U.qst = ''; ir('stock'); break;
    case 'ir-compras': ir('compras'); break;
    case 'ir-catalogo': ir('catalogo'); break;
    case 'sub': U.sub = d.s; pintar(); break;
    case 'mes': U.F.mes = String(U.F.mes) === d.m && U.ruta === 'ventas' ? '' : d.m; U.F.anio = U.ruta === 'inicio' ? anioHoy : U.F.anio; U.sub = 'informe'; if (U.ruta === 'ventas') pintar(); else ir('ventas'); break;
    case 'fped': U.fped = d.k; pintar(); break;
    case 'fst': U.fst = d.k; pintar(); break;
    case 'ver': abrirVenta(d.id); break;
    case 'prod': abrirProd(d.id); break;
    case 'estado': { const v = DB.ventas.find(x => x.id === d.id); if (v) { cambiarEstado(v, d.e); tras('Pedido ' + v.n + ': ' + EST[d.e].toLowerCase()); } break; }
    case 'cobrar': { const v = DB.ventas.find(x => x.id === d.id); if (v) { foto(); v.cobrado = !v.cobrado; if (!v.cobrado) v.pago = ''; tras('Pedido ' + v.n + (v.cobrado ? ' cobrado' : ' sin cobrar')); } break; }
    case 'anular': U.anular = d.id; confirmar('¿Anular esta venta?', 'Se quita del informe. Si ya estaba entregada, las unidades vuelven al stock.', 'anular-si', 'Anular venta'); break;
    case 'anular-si': { const v = DB.ventas.find(x => x.id === U.anular); if (v) { foto(); if (v.estado === 'entregado') cambiarEstado(v, 'prep', true); DB.ventas = DB.ventas.filter(x => x !== v); cerrar(); tras('Pedido ' + v.n + ' anulado'); } break; }
    case 'copiar-comp': { const v = DB.ventas.find(x => x.id === d.id); if (v) copiar(comprobante(v), 'Comprobante copiado'); break; }
    case 'copiar-cat': copiar(textoCatalogo(), 'Catálogo copiado'); break;
    case 'csv': copiar(csv(filtrar(U.F)), 'Ventas copiadas: pegalas en Excel'); break;
    case 'aj': { const p = P(d.id), v = p && V(p, d.c); if (v) { foto(); v.stock = Math.max(0, v.stock + Number(d.d)); mov('ajuste', p.id, v.color, Number(d.d), 'Corrección de conteo'); tras(p.nombre + ' · ' + v.color + ': ' + v.stock + ' en mano'); } break; }
    case 'guardar-prod': { const p = P(d.id); if (p) { foto(); p.precio = Math.max(0, Number($('#e-precio').value) || 0); p.min = Math.max(0, Number($('#e-min').value) || 0); tras('Cambios guardados'); } break; }
    case 'color-add': { const p = P(d.id); if (!p) break; let c = (d.c || $('#e-color').value).trim(); const n = d.c ? 0 : Math.max(0, Math.floor(Number($('#e-cant').value) || 0)), er = $('#err-color');
      if (!c) { er.textContent = 'Escribí el nombre del color.'; er.hidden = false; $('#e-color').focus(); break; }
      c = c[0].toUpperCase() + c.slice(1);
      if (p.variantes.some(v => v.color.toLowerCase() === c.toLowerCase())) { er.textContent = 'Ese color ya está en este producto.'; er.hidden = false; break; }
      foto(); p.variantes.push({ color:c, stock:n }); if (n) mov('ajuste', p.id, c, n, 'Color nuevo'); tras('Color agregado: ' + p.nombre + ' · ' + c); break; }
    case 'piel': U.piel = d.k; document.documentElement.dataset.piel = d.k; try { localStorage.setItem('piri.gestion.piel', d.k); } catch (e) {} pintar(); break;
    case 'nuevo-prod': abrirNuevoProd(); break;
    case 'crear-prod': { const n = $('#n-nombre').value.trim(); if (!n) { $('#err-nombre').hidden = false; $('#n-nombre').focus(); break; }
      const cols = $('#n-colores').value.split(',').map(s => s.trim()).filter(Boolean), cant = Math.max(0, Number($('#n-cant').value) || 0);
      foto(); DB.sec.p++; const p = { id:'P' + DB.sec.p, nombre:n, precio:Math.max(0, Number($('#n-precio').value) || 0), costo:Math.max(0, Number($('#n-costo').value) || 0), min:Math.max(0, Number($('#n-min').value) || 0), variantes:(cols.length ? cols : ['Único']).map(c => ({ color:c[0].toUpperCase() + c.slice(1), stock:cant })) };
      DB.productos.push(p); cerrar(); tras('Producto agregado: ' + n); break; }
    case 'nueva-compra': abrirCompra(d.id); break;
    case 'guardar-compra': { const p = P($('#c-prod').value), cant = Math.floor(Number($('#c-cant').value)), cu = Number($('#c-costo').value); if (!p || !(cant > 0) || !(cu > 0)) { $('#err-compra').hidden = false; break; }
      const v = V(p, $('#c-color').value); if (!v) break; foto();
      const antes = fisicoP(p); p.costo = Math.round((antes * p.costo + cant * cu) / (antes + cant)); v.stock += cant;
      DB.sec.c++; DB.compras.push({ id:'C' + DB.sec.c, fecha:$('#c-fecha').value || hoy(), proveedor:$('#c-prov').value.trim(), pid:p.id, color:v.color, cant, costo:cu });
      mov('compra', p.id, v.color, cant, $('#c-prov').value.trim()); cerrar(); tras('Compra guardada: +' + cant + ' ' + p.nombre + ' · ' + v.color); break; }
    case 'reiniciar': confirmar('¿Volver a los datos de ejemplo?', 'Se borra todo lo que cargaste en esta prueba y vuelven las ventas y el stock ficticios del inicio.', 'reiniciar-si', 'Borrar y reiniciar'); break;
    case 'reiniciar-si': foto(); DB = semilla(); U.B = null; cerrar(); tras('Datos de ejemplo restaurados'); break;
    case 'deshacer': if (deshacer) { DB = JSON.parse(deshacer); deshacer = null; guardar(); const h = U.hoja; pintar(); if (h) { U.hoja = h; if ((h.t === 'venta' && DB.ventas.some(x => x.id === h.id)) || (h.t === 'prod' && P(h.id))) repintarHoja(); else cerrar(); } toast('Cambio deshecho'); } break;
    case 'b-color': U.B.sel[d.p] = d.c; $('#lnueva').innerHTML = listaNueva(); break;
    case 'b-mas': case 'b-menos': { const B = U.B, a2 = d.k.split('|'), p = P(a2[0]), v = p && V(p, a2[1]); if (!v) break; const c = B.items[d.k] || 0, n = a === 'b-mas' ? Math.min(disp(p, v), c + 1) : Math.max(0, c - 1); if (n) B.items[d.k] = n; else delete B.items[d.k]; B.sel[p.id] = a2[1]; $('#lnueva').innerHTML = listaNueva(); $('#pie').innerHTML = pieNueva(); break; }
    case 'b-sig': { const B = U.B; if (B.paso === 2 && !B.cliente.trim()) { $('#err-cliente').hidden = false; $('#cliente').focus(); break; } if (B.paso < 3) { B.paso++; pintar(); window.scrollTo(0, 0); } else guardarVenta(); break; }
  }
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'qped') { U.qped = t.value; $('#lped').innerHTML = listaPedidos(); }
  else if (t.id === 'qst') { U.qst = t.value; $('#lst').innerHTML = listaStock(); }
  else if (t.id === 'qn') { U.B.q = t.value; $('#lnueva').innerHTML = listaNueva(); }
  else if (t.dataset.b && U.B) { U.B[t.dataset.b] = t.type === 'checkbox' ? t.checked : t.value; if (t.dataset.b === 'descuento') $('#pie').innerHTML = pieNueva(); }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.f) { U.F[t.dataset.f] = t.value; pintar(); }
  else if (t.id === 'cobrado' && U.B) { U.B.cobrado = t.checked; pintar(); }
  else if (t.id === 'c-prod') abrirCompra(t.value);
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && $('#capa').innerHTML) cerrar(); });
window.addEventListener('hashchange', () => { cerrar(); pintar(); window.scrollTo(0, 0); abrirPend(); });
try { U.piel = localStorage.getItem('piri.gestion.piel') || 'piri'; } catch (e) { U.piel = 'piri'; }
if (['piri', 'noche', 'clasico'].indexOf(U.piel) < 0) U.piel = 'piri';
document.documentElement.dataset.piel = U.piel;
cargar();
if (lsGet('piri.gestion.modo') === 'real') { try { const c = JSON.parse(lsGet('piri.gestion.real') || 'null'); if (c && c.productos && c.ventas) { DB = c; U.real = true; } } catch (e) {} }
if (hayCandado()) trabar();
pintar();
if (U.real) conectarReal(true);
if ('serviceWorker' in navigator && location.protocol === 'https:') { try { navigator.serviceWorker.register('sw.js').catch(function () {}); } catch (e) {} }
document.addEventListener('keydown', e => { if (e.key !== 'Enter') return; if (e.target.id === 'cd-pin') entrarCandado(); else if (e.target.id === 'cd-r') guardarCandado(); });
let seFue = 0;
document.addEventListener('visibilitychange', () => { if (document.hidden) seFue = Date.now(); else if (seFue && Date.now() - seFue > 5 * 60000 && hayCandado() && $('#candado').hidden) { cerrar(); trabar(); } });
</script>
</body>
</html>
